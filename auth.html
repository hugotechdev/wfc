<!DOCTYPE html>
<html lang="sw" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ingia au Jisajili — WFC Digital Office</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/portal.css">
</head>
<body class="auth-page">

  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="brand">
        <div class="brand-emblem" aria-hidden="true">WFC</div>
        <div class="brand-text">
          <span class="brand-title">WACHAGGA FAMILY COMMUNITY</span>
          <span class="brand-subtitle">STAND UP, IT'S NOT OVER</span>
        </div>
      </a>

      <div class="header-actions">
        <button type="button" id="theme-toggle" class="icon-btn" title="Badili Mandhari" aria-label="Badili Mandhari">
          <svg class="icon-outline icon-moon" viewBox="0 0 24 24">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
          <svg class="icon-outline icon-sun" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path>
          </svg>
        </button>
        <a href="index.html" class="btn btn-ghost btn-sm">Rudi Mwanzo</a>
      </div>
    </div>
  </header>

  <main class="auth-main">
    <div class="auth-card">
      <div class="section-title-bar">
        <h1 style="font-size: 20px;">Ofisi ya Mwanachama WFC</h1>
      </div>
      <p style="font-size: 13px; color: var(--text-secondary); margin-top: 6px;">
        Tumia WFC ID au namba yako ya simu kufikia taarifa za michango, risiti na tiketi.
      </p>

      <div class="auth-tabs" role="tablist">
        <button type="button" class="auth-tab active" data-auth-tab="login">Ingia Kwenye Akaunti</button>
        <button type="button" class="auth-tab" data-auth-tab="register">Jisajili Mwanachama</button>
      </div>

      <!-- Login Form -->
      <form class="auth-form active" id="login-form">
        <label class="field-group">
          <span>WFC ID au Namba ya Simu</span>
          <input type="text" value="WFC-0007" placeholder="Mfano: WFC-0007 au 0755..." required>
        </label>

        <label class="field-group">
          <span>Nywila (Password)</span>
          <input type="password" value="••••••••" placeholder="Weka nywila yako" required>
        </label>

        <button type="submit" class="btn btn-gold btn-block">
          <span>Ingia Kwenye Dashibodi</span>
          <svg class="icon-outline" viewBox="0 0 24 24">
            <path d="M5 12h14M13 6l6 6-6 6"></path>
          </svg>
        </button>
      </form>

      <!-- Register Form -->
      <form class="auth-form" id="register-form">
        <label class="field-group">
          <span>Jina Kamili</span>
          <input type="text" placeholder="Mfano: Hugo Mushi" required>
        </label>

        <div class="auth-row-2">
          <label class="field-group">
            <span>Kanda Unayoishi</span>
            <select required>
              <option value="Dar es Salaam - Machame">Dar es Salaam - Machame</option>
              <option value="Dar es Salaam - Rombo">Dar es Salaam - Rombo</option>
              <option value="Dar es Salaam - Marangu">Dar es Salaam - Marangu</option>
              <option value="Moshi / Kilimanjaro">Moshi / Kilimanjaro</option>
              <option value="Arusha">Arusha</option>
            </select>
          </label>

          <label class="field-group">
            <span>Asili (Nyumbani)</span>
            <input type="text" placeholder="Mfano: Machame" required>
          </label>
        </div>

        <label class="field-group">
          <span>Namba ya Simu (WhatsApp)</span>
          <input type="tel" placeholder="07XX XXX XXX" required>
        </label>

        <label class="field-group">
          <span>Tengeneza Nywila</span>
          <input type="password" placeholder="Angalau herufi 6" required>
        </label>

        <button type="submit" class="btn btn-gold btn-block">Kamilisha Usajili wa WFC</button>
      </form>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; 2026 Wachagga Family Community (WFC) &mdash; <em>Stand up, It's not over.</em></p>
    </div>
  </footer>

  <div class="toast-banner" id="toast-banner" role="status" aria-live="polite"></div>
  <script src="assets/js/app.js"></script>
</body>
</html>
