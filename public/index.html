<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WFC Portal | Wachagga Family Community</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="app">
    <!-- Login Screen -->
    <div id="login-screen" class="screen">
      <div class="login-container">
        <img src="/wfc-logo.jpg" alt="WFC Logo" class="logo">
        <h1>Karibu kwenye WFC Portal</h1>
        <p class="subtitle">Umoja wa Wachagga, Nguvu ya Familia</p>
        <form id="login-form">
          <div class="form-group">
            <label>Barua pepe / Namba ya Simu</label>
            <input type="text" placeholder="mfano: mwanachama@wfc.or.tz" required>
          </div>
          <div class="form-group">
            <label>Nenosiri</label>
            <input type="password" placeholder="Weka nenosiri lako" required>
          </div>
          <button type="submit" class="btn-primary">Ingia</button>
        </form>
        <p class="slogan">Stand up · It's not over</p>
      </div>
    </div>

    <!-- Dashboard Screen -->
    <div id="dashboard-screen" class="screen hidden">
      <aside class="sidebar">
        <div class="sidebar-logo">
          <img src="/wfc-logo.jpg" alt="WFC">
          <p>WACHAGGA FAMILY COMMUNITY</p>
          <small>Stand up · It's not over</small>
        </div>
        <nav>
          <a href="#" class="nav-item active" data-page="home">Dashboard</a>
          <a href="#" class="nav-item" data-page="members">Wanachama</a>
          <a href="#" class="nav-item" data-page="contributions">Michango</a>
          <a href="#" class="nav-item" data-page="events">Matukio</a>
          <a href="#" class="nav-item" data-page="announcements">Matangazo</a>
        </nav>
        <a href="#" id="logout" class="nav-item logout">Toka nje</a>
      </aside>

      <main class="main-content">
        <header class="topbar">
          <h2 id="page-title">Dashboard</h2>
          <div class="user-info">Admin / Mwenyekiti</div>
        </header>
        <div id="content" class="content"></div>
      </main>
    </div>
  </div>
  <script src="/js/app.js"></script>
</body>
</html>
