<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WFC | Wachagga Family Community</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .hero{text-align:center;padding:60px 20px;background:var(--card);border-bottom:1px solid var(--border)}
    .hero img{width:120px;height:120px;border-radius:50%}
    .section{max-width:1000px;margin:0 auto;padding:40px 20px}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
    .ev{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden}
    .ev .b{padding:16px}
  </style>
</head>
<body>
  <div class="hero">
    <img src="/wfc-logo.jpg" alt="WFC">
    <h1>Wachagga Family Community</h1>
    <p>Umoja wa Wachagga, Nguvu ya Familia</p>
    <div style="margin-top:20px">
      <a href="/app" class="btn" style="width:auto;padding:12px 28px">Ingia / Jisajili</a>
    </div>
  </div>
  <div class="section"><h2>Matukio</h2><div class="grid" id="ev">Inapakia...</div></div>
  <div class="section"><h2>Matangazo</h2><div id="an">Inapakia...</div></div>
  <script>
    fetch("/api/public/events").then(r=>r.json()).then(list=>{
      document.getElementById("ev").innerHTML = list.length ? list.map(e=>`
        <div class="ev"><div class="b">
          <span class="badge badge-pending">${e.type||"Tukio"}</span>
          <h3 style="margin:8px 0">${e.title}</h3>
          <p style="font-size:.85rem;color:var(--text-muted)">${e.location||""}</p>
          <p style="font-weight:700;margin-top:8px">TSh ${(e.ticketPrice||0).toLocaleString()}</p>
          <a href="/ticket/${e.id}" class="btn" style="width:auto;margin-top:10px;padding:8px 16px;font-size:.85rem">Kata Tiketi</a>
        </div></div>`).join("") : "<p>Hakuna matukio</p>";
    });
    fetch("/api/public/announcements").then(r=>r.json()).then(list=>{
      document.getElementById("an").innerHTML = list.length ? list.map(a=>`<div class="card"><strong>${a.title}</strong><p style="margin-top:6px">${a.body}</p></div>`).join("") : "<p>Hakuna matangazo</p>";
    });
  </script>
</body>
</html>
