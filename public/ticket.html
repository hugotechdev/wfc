<!DOCTYPE html>
<html lang="sw">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Kata Tiketi</title><link rel="stylesheet" href="/css/style.css"></head>
<body>
  <div class="container" style="margin-top:40px">
    <img src="/wfc-logo.jpg" class="logo"><h1>Kata Tiketi</h1>
    <div id="info">Inapakia...</div>
    <form id="f" class="hidden">
      <div class="form-group"><label>Jina</label><input name="name" required></div>
      <div class="form-group"><label>Simu</label><input name="phone" required></div>
      <div class="form-group"><label>Idadi</label><input name="qty" type="number" value="1" min="1"></div>
      <div class="form-group"><label>Namba ya Muamala</label><input name="transactionId" required></div>
      <button class="btn" type="submit">Wasilisha</button><div id="m"></div>
    </form>
    <p class="link"><a href="/">Rudi</a></p>
  </div>
  <script>
    const id = location.pathname.split("/").pop();
    fetch("/api/public/events").then(r=>r.json()).then(list=>{
      const e = list.find(x=>x.id===id);
      if(!e){ document.getElementById("info").innerHTML="Haijapatikana"; return; }
      document.getElementById("info").innerHTML = `<h2>${e.title}</h2><p>${e.location||""}</p><p style="font-weight:700;margin:8px 0">TSh ${(e.ticketPrice||0).toLocaleString()}</p>`;
      document.getElementById("f").classList.remove("hidden");
    });
    document.getElementById("f").onsubmit = async e => {
      e.preventDefault();
      const body = Object.fromEntries(new FormData(e.target)); body.eventId = id;
      const r = await fetch("/api/tickets",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
      const d = await r.json();
      document.getElementById("m").innerHTML = d.success ? `<div class="success">Imewasilishwa</div>` : `<div class="error">${d.error||"Imeshindwa"}</div>`;
    };
  </script>
</body>
</html>
