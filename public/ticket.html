<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WFC Tiketi — Wachagga Family Community</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="auth-page">
    <div class="container">
      <div class="auth-topbar">
        <a href="/" class="brand-inline" style="text-decoration:none;color:inherit">
          <img src="/wfc-logo.jpg" alt="WFC">
          <div><div class="b-title">WFC Tiketi</div><div class="b-sub">Wachagga Family Community</div></div>
        </a>
        <button class="theme-toggle" onclick="document.body.classList.toggle('dark')" type="button">◐ Mandhari</button>
      </div>
      <div id="event"></div>
      <form id="f">
        <div class="form-group"><label>Jina Kamili</label><input name="name" placeholder="Mf. Amina Swai" required></div>
        <div class="form-group"><label>Namba ya Simu</label><input name="phone" placeholder="07XX XXX XXX" required></div>
        <div class="form-group"><label>Namba ya Muamala</label><input name="transactionId" placeholder="Mf. QK82J910LP" required></div>
        <button class="btn" type="submit">Wasilisha Tiketi</button>
        <div id="m"></div>
      </form>
      <p class="link"><a href="/">← Rudi Mwanzo</a></p>
    </div>
  </div>
  <script>
    const id = location.pathname.split("/").pop();
    fetch("/api/public/events").then(r=>r.json()).then(list=>{
      const ev = list.find(x=>x.id===id);
      if (ev) document.getElementById("event").innerHTML = `<h2>${ev.title}</h2><p class="subtitle">Mahali: ${ev.location} &middot; Bei: TSh ${Number(ev.ticketPrice).toLocaleString()}</p>`;
    });
    document.getElementById("f").onsubmit = async e => {
      e.preventDefault();
      const body = Object.fromEntries(new FormData(e.target));
      body.eventId = id;
      const r = await fetch("/api/tickets", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
      const d = await r.json();
      document.getElementById("m").innerHTML = d.error ? `<div class="error">${d.error}</div>` : `<div class="success">Tiketi imewasilishwa! Subiri uthibitisho wa malipo.</div>`;
    };
  </script>
</body>
</html>
