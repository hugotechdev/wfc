<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kata Tiketi — WFC</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="container" style="margin-top:40px">
    <img src="/wfc-logo.jpg" class="logo" alt="WFC">
    <h1>Kata Tiketi ya Tukio</h1>
    <div id="info" style="text-align:center;margin:12px 0">Inapakia...</div>
    <form id="f" style="display:none">
      <div class="form-group"><label>Jina Kamili</label><input name="name" required></div>
      <div class="form-group"><label>Namba ya Simu</label><input name="phone" required></div>
      <div class="form-group"><label>Idadi ya Tiketi</label><input name="qty" type="number" value="1" min="1" max="50"></div>
      <div class="form-group"><label>Namba ya Muamala (M-Pesa / Tigo / Benki)</label><input name="transactionId" required></div>
      <button class="btn" type="submit">Thibitisha Tiketi</button>
      <div id="m"></div>
    </form>
    <p class="link"><a href="/">← Rudi Tovuti Kuu</a></p>
  </div>
  <script>
    const id = location.pathname.split("/").pop();
    fetch("/api/public/events").then(r => r.json()).then(list => {
      const e = list.find(x => x.id === id);
      if (!e) { document.getElementById("info").innerHTML = "Tukio halijapatikana."; return; }
      document.getElementById("info").innerHTML = `<h2>${e.title}</h2><p class="muted">${e.location || ""} ${e.eventDate ? "· " + e.eventDate : ""}</p><p style="font-weight:700;margin:8px 0">Bei: TSh ${(e.ticketPrice || 0).toLocaleString()} / tiketi</p><small class="muted">Lipa kupitia M-Pesa 0755 000 888 au CRDB 0150889944200</small>`;
      document.getElementById("f").style.display = "block";
    });
    document.getElementById("f").onsubmit = async e => {
      e.preventDefault();
      const body = Object.fromEntries(new FormData(e.target));
      body.eventId = id;
      const r = await fetch("/api/tickets", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
      const d = await r.json();
      document.getElementById("m").innerHTML = d.success
        ? `<div class="success">Tiketi imesajiliwa! Namba yako ya Tiketi: <strong>${d.ticketCode}</strong></div>`
        : `<div class="error">${d.error || "Imeshindwa"}</div>`;
      if (d.success) e.target.reset();
    };
  </script>
</body>
</html>
